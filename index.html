<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoList</title>
    <!-- bootstrap icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- css -->
    <link rel="stylesheet" href="asset/css/ToDo.css">
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>
    <section class="mainHolder">
        <div class="todoHolder rounded">
            <div class="item1">
                <h1 class="">What To Do?!</h1>
            </div>
            <div class="item2">
                <input type="text" class="workinput z-2" placeholder="type yur work here">
                <button type="button" class="btmSub z-1" aria-label="add" onodblclick="">
                    Submit
                </button>
            </div>
            <div class="item3 mt-4">
                <ul class="result list-unstyled mb-0">
                </ul>
            </div>
        </div>
    </section>
</body>

<script src="asset/js/ToDo.js"></script>
</html>
